name: Azure IMDS Test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Azure IMDS
        run: |
          echo "=== Azure IMDS Test ==="
          
          # Azure IMDS with proper header
          echo "--- Instance metadata ---"
          curl -s -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | head -500
          
          echo ""
          echo "--- Identity token ---"
          curl -s -H "Metadata: true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>&1 | head -100
          
          echo ""
          echo "--- Subscription info ---"
          curl -s -H "Metadata: true" "http://169.254.169.254/metadata/instance/compute/subscriptionId?api-version=2021-02-01&format=text" 2>&1
          
          echo ""
          echo "--- Network info ---"
          curl -s -H "Metadata: true" "http://169.254.169.254/metadata/instance/network?api-version=2021-02-01" 2>&1 | head -200
