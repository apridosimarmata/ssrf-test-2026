name: OIDC Orchestrator Test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token and test orchestrator
        run: |
          echo "=== GitHub OIDC Token Request ==="
          echo "URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          
          # Get the OIDC token
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://hosted-compute-ro" | jq -r '.value')
            echo "Token (first 50 chars): ${TOKEN:0:50}..."
            
            # Decode JWT header and payload
            echo ""
            echo "=== JWT Header ==="
            echo $TOKEN | cut -d. -f1 | base64 -d 2>/dev/null | jq .
            
            echo ""
            echo "=== JWT Payload ==="
            echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .
            
            BASE_URL="https://hosted-compute-request-orchestrator-prod-eus-01.githubapp.com"
            
            echo ""
            echo "=== Test orchestrator with OIDC token ==="
            curl -s -w "\nHTTP: %{http_code}\n" -H "Authorization: Bearer $TOKEN" "$BASE_URL/vm/v1" | head -30
            
            echo ""
            echo "=== Test with different auth header ==="
            curl -s -w "\nHTTP: %{http_code}\n" -H "X-Ms-Token: $TOKEN" "$BASE_URL/vm/v1" | head -30
            
            # Try fetching JWKS
            echo ""
            echo "=== Fetch JWKS ==="
            curl -s "https://hosted-compute-request-orchestrator-prod-eus-01.service.azure-eastus.github.net/.well-known/jwks" | head -50
          else
            echo "OIDC not available"
          fi
