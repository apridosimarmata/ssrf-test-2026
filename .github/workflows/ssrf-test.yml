name: SSRF Test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      
      - name: Fetch submodules
        run: |
          git submodule update --init --recursive || true
          git lfs fetch --all || true
