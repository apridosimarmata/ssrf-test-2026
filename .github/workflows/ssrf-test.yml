name: SSRF Test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      
      - name: Manual submodule init
        run: |
          cat .gitmodules
          echo "---"
          git submodule init 2>&1 || true
          echo "---"
          git submodule update --recursive 2>&1 || true
          
      - name: Test git protocols
        run: |
          # Try various git clone operations
          git clone git://127.0.0.1/test.git /tmp/test1 2>&1 || echo "git:// failed"
          git clone http://169.254.169.254/test.git /tmp/test2 2>&1 || echo "imds clone failed"
          git ls-remote http://169.254.169.254/latest/meta-data/ 2>&1 || echo "ls-remote failed"
