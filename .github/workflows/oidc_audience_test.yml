name: OIDC Audience Research
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test internal audiences
        run: |
          echo "=== Testing OIDC token for various audiences ==="
          
          # Standard audience
          STANDARD=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value // .error')
          echo "api://AzureADTokenExchange: ${STANDARD:0:50}..."
          
          # Internal hosted-compute audiences  
          for aud in "api://hosted-compute-ro" "api://hosted-compute-rw" "api://actions-internal" \
                     "https://ghe.io" "api://ghe.io" "https://github.okta.com" \
                     "https://vstoken.actions.githubusercontent.com" \
                     "api://management-console" "api://github-internal"; do
            RESULT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" 2>/dev/null)
            TOKEN=$(echo "$RESULT" | jq -r '.value // empty')
            ERROR=$(echo "$RESULT" | jq -r '.error // empty')
            if [ -n "$TOKEN" ]; then
              echo "✅ $aud: GOT TOKEN"
              # Decode and show claims
              echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq -c '.aud, .iss' 2>/dev/null
            else
              echo "❌ $aud: $ERROR"
            fi
          done
